<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Open Sans";
    src: url("file:///Users/sashimi/Documents/testai2/typewriter-test/public/fonts/opensans.woff2") format("woff2");
    font-weight: 300 800;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Open Sans", Arial, sans-serif;
    color: #262626;
    position: relative;
    background: #e8e7e1;
  }
  .bg {
    position: absolute; inset: 0;
    background: url("file:///Users/sashimi/Documents/testai2/typewriter-test/public/art/collage.jpg") right center / cover no-repeat;
  }
  .veil {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(248,245,235,0.82) 0%, rgba(248,245,235,0.62) 55%, rgba(248,245,235,0.28) 100%);
  }
  .logo {
    position: absolute; top: 38px; left: 56px; height: 52px;
  }
  .content { position: absolute; left: 56px; top: 178px; }
  .tag {
    display: inline-block;
    background: #262626; color: #fff;
    font-size: 25px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em;
    padding: 8px 22px 10px;
    transform: rotate(-1.4deg);
    box-shadow: 4px 5px 0 rgba(38,38,38,0.18);
    margin-bottom: 30px;
  }
  h1 { font-size: 74px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; }
  h1 .accent {
    display: inline-block;
    background: #c03a2e; color: #fff;
    padding: 0 20px 6px;
    transform: rotate(-1.2deg);
    margin-top: 10px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: #262626;
    border: 2.5px solid #fff;
    border-radius: 999px;
    padding: 10px 15px;
    margin-top: 38px;
    box-shadow: 0 6px 18px rgba(20,20,18,0.3);
  }
  .dot {
    width: 34px; height: 34px; border-radius: 50%;
    border: 1.8px solid #fff; color: #fff;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 600;
  }
  .strip {
    position: absolute; left: 0; right: 0; bottom: 0; height: 46px;
    background: #262626;
  }
  .credit {
    position: absolute; right: 56px; bottom: 12px; z-index: 2;
    font-family: "Courier New", monospace;
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.3em; text-transform: uppercase;
    color: #fff;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="veil"></div>
  <img class="logo" src="file:///Users/sashimi/Documents/testai2/typewriter-test/public/hmarochos_logo_new.svg" alt="">
  <div class="content">
    <div class="tag">Тест</div>
    <h1>
      Перевірте, чи легко<br>
      <span class="accent">вами маніпулювати</span>
    </h1>
    <div class="pill">
      <span class="dot">1</span><span class="dot">2</span><span class="dot">3</span><span class="dot">4</span><span class="dot">5</span><span class="dot">6</span><span class="dot">7</span><span class="dot">8</span><span class="dot">9</span><span class="dot">10</span>
    </div>
  </div>
  <div class="credit">Тест · <b>Хмарочос</b></div>
  <div class="strip"></div>
</body>
</html>
